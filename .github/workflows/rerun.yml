name: rerun-offline-units
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # 毎週月曜 03:17 UTC — 環境が変わっても再実行できることを確かめ続ける
  workflow_dispatch:
permissions:
  contents: write          # 派生ファイル（n/・kb/kb.jsonld・llms.txt）と kb/rerun-latest.json を commit するため
concurrency:
  group: rerun-latest
  cancel-in-progress: false
jobs:
  rerun:
    # 自分（github-actions[bot]）の commit による push では走らない（[skip ci] と二重の保険）
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild derived pages from kb/nodes.json (n/<id>.html|json, kb/kb.jsonld, kb/backlinks.json, llms.txt, sitemap.txt)
        run: python3 build_site.py
      - name: Re-execute offline ExecutionUnits and compare with recorded expected values
        id: rerun
        run: python3 rerun.py --json kb/rerun-latest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerun_results
          path: kb/rerun-latest.json
      - name: Commit derived files and kb/rerun-latest.json (only when something changed)
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # rerun-latest.json は生成時刻だけの差分では commit しない（結果の内容が変わったときだけ）
          if git show HEAD:kb/rerun-latest.json >/tmp/prev.json 2>/dev/null; then
            python3 - <<'EOF2' || git checkout -- kb/rerun-latest.json
          import json,sys
          a=json.load(open('/tmp/prev.json')); b=json.load(open('kb/rerun-latest.json'))
          key=lambda d:[(r['id'],r['status'],r.get('got'),r.get('want')) for r in d.get('results',[])]
          same = key(a)==key(b) and a.get('n_pass')==b.get('n_pass') and a.get('python')==b.get('python') and a.get('kb_generated_at')==b.get('kb_generated_at')
          sys.exit(0 if not same else 1)
          EOF2
          fi
          git add -A n kb llms.txt sitemap.txt
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "CI: derived pages + kb/rerun-latest.json (rerun ${{ steps.rerun.outcome }}) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
